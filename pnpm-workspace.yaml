allowBuilds:
  sharp: true
  unrs-resolver: true

# Security patches for transitive deps pinned below their fixed versions
# (next@15.5.x pins postcss 8.4.31; the rest come via next and eslint-config-next).
# Each stays within the range its dependent accepts. Drop entries once upstream catches up.
overrides:
  postcss@<8.5.18: ^8.5.29
  sharp@<0.35.5: ^0.35.5
  nanoid@<3.3.18: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2
  js-yaml@<4.3.2: ^4.3.2
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=5 <5.0.11: ^5.0.11
